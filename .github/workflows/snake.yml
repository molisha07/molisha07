name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"     # runs daily at midnight UTC
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39d353&color_dots=#FAF0F2,#F8C8D8,#F498B8,#EE6897,#E53E77
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#39d353&color_dots=#1a1517,#3a222a,#5c2f3f,#8a3f59,#c95278

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
